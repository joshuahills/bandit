name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore src/Bandit/Bandit.csproj

      - name: Build
        run: dotnet build src/Bandit/Bandit.csproj -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path . -Filter '*.Tests.csproj' -Recurse
          if ($testProjects) {
            foreach ($p in $testProjects) {
              dotnet test $p.FullName -c Release
            }
          } else {
            Write-Host 'No test projects found, skipping tests.'
          }

  publish-pr:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      # Check out the PR branch's actual head (not the merge ref) so commit
      # counting reflects just what's on the branch. fetch-depth: 0 brings in
      # all tags so we can read the latest released patch number.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Compute version
        shell: pwsh
        run: |
          # Master is at v0.1.<N>; the next release will be v0.1.<N+1>. PR
          # builds pin to that next-patch number so they sort sensibly as
          # pre-releases of the version they would land in.
          $latestTag = git tag --list 'v0.1.*' --sort=-v:refname | Select-Object -First 1
          $nextPatch = if ($latestTag) { [int]($latestTag -replace '^v0\.1\.', '') + 1 } else { 0 }

          $prNumber = '${{ github.event.pull_request.number }}'
          $branchCommits = '${{ github.event.pull_request.commits }}'

          $version = "0.1.$nextPatch-pr.$prNumber.$branchCommits"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Publish AOT exe
        run: dotnet publish src/Bandit/Bandit.csproj -c Release -r win-x64 /p:Version=${{ env.VERSION }} -o publish/exe

      - name: Pack .NET tool
        run: dotnet pack src/Bandit/Bandit.csproj -c Release /p:PackAsTool=true /p:Version=${{ env.VERSION }} -o publish/tool

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bandit-${{ env.VERSION }}
          path: |
            publish/exe/Bandit.exe
            publish/tool/*.nupkg

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `📦 Pre-release build \`${version}\` ready.`,
              ``,
              `**Download:** [workflow artifacts](${runUrl}#artifacts)`,
              ``,
              `**Install the .NET tool locally** (after downloading and unzipping the artifact):`,
              '```',
              `dotnet tool install -g --add-source ./bandit-${version} Bandit --version ${version}`,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
        env:
          VERSION: ${{ env.VERSION }}
